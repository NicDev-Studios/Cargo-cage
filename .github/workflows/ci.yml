name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ubuntu:
    name: Ubuntu sandbox tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Prepare Ubuntu for Bubblewrap namespaces
        run: |
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            test "$(< /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 0
          fi
      - name: Install sandbox runtime
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap
      - name: Check sandbox runtime
        run: bwrap --version
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --workspace
