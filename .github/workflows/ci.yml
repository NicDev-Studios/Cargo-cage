name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ubuntu:
    name: Ubuntu sandbox tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Prepare Ubuntu for Bubblewrap namespaces
        run: |
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            test "$(< /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 0
          fi
      - name: Install sandbox runtime
        run: bash .github/scripts/install-bubblewrap.sh
      - name: Check sandbox runtime
        run: |
          bwrap --version
          dpkg --compare-versions "$(bwrap --version | awk 'NR == 1 { print $2 }')" ge "0.12.0"
          [[ "$(stat --format='%A' /usr/bin/bwrap)" != *s* ]]
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --workspace
      - name: Run doctor smoke check
        run: cargo run --quiet --package cargo-cage -- doctor
