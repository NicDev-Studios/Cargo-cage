name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ubuntu:
    name: Ubuntu sandbox tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - name: Prepare Ubuntu for Bubblewrap namespaces
        run: |
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            test "$(< /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 0
          fi
      - name: Install sandbox runtime
        run: bash .github/scripts/install-bubblewrap.sh
      - name: Install red-team tools
        run: sudo apt-get install --yes python3 util-linux
      - name: Prepare delegated cgroup v2 resources
        shell: bash
        run: |
          set -euo pipefail
          root=/sys/fs/cgroup
          group="$root/cargo-cage-ci"
          leaf="$group/runner"
          if sudo test -e "$group"; then
            echo "::error::delegated cgroup path already exists: $group"
            exit 1
          fi
          for controller in cpu memory pids; do
            sudo grep -qw "$controller" "$root/cgroup.controllers" || {
              echo "::error::required cgroup controller is unavailable: $controller"
              exit 1
            }
          done
          sudo sh -c 'printf "+cpu +memory +pids\n" > /sys/fs/cgroup/cgroup.subtree_control'
          sudo mkdir "$group"
          sudo grep -qw cpu "$root/cgroup.subtree_control"
          sudo grep -qw memory "$root/cgroup.subtree_control"
          sudo grep -qw pids "$root/cgroup.subtree_control"
          sudo sh -c "printf '+cpu +memory +pids\\n' > '$group/cgroup.subtree_control'"
          sudo mkdir "$leaf"
          # A cgroup with delegated domain controllers cannot contain
          # processes itself. Keep the runner in a leaf and let cargo-cage
          # create its short-lived resource cgroups next to that leaf.
          sudo chown "$USER":"$USER" "$group" "$group/cgroup.procs" "$leaf" "$leaf/cgroup.procs"
          sudo sh -c "printf '%s\\n' '$PPID' > '$leaf/cgroup.procs'"
      - name: Check sandbox runtime
        run: |
          bwrap --version
          dpkg --compare-versions "$(bwrap --version | awk 'NR == 1 { print $2 }')" ge "0.12.0"
          [[ "$(stat --format='%A' /usr/bin/bwrap)" != *s* ]]
      - name: Validate composite action metadata
        run: |
          ruby -e '
            require "yaml"
            action = YAML.load_file("action.yml")
            abort "action.yml must declare a composite action" unless action.dig("runs", "using") == "composite"
            %w[command args cargo-cage-version install-from-source].each do |name|
              abort "action.yml is missing input #{name}" unless action.dig("inputs", name)
            end
            puts "action.yml: valid composite action metadata"
          '
      - name: Run Rust CI mirror
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=15s 15m \
            cargo run --manifest-path tools/ci-check/Cargo.toml --locked -- \
            --require-linux
      - name: Exercise local composite action
        uses: ./
        with:
          install-from-source: true
          cargo-cage-version: 0.1.0-alpha.2
          command: build
          args: --locked --workspace
      - name: Clean up delegated cgroup v2 resources
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root=/sys/fs/cgroup
          group="$root/cargo-cage-ci"
          if [[ -d "$group" ]]; then
            sudo sh -c "printf '%s\\n' '$BASHPID' > '$root/cgroup.procs'; printf '%s\\n' '$PPID' > '$root/cgroup.procs'"
            sudo sh -c "printf '1\\n' > '$group/cgroup.kill'"
            mapfile -t children < <(sudo find "$group" -mindepth 1 -type d -depth -print)
            for child in "${children[@]}"; do
              sudo sh -c "printf '1\\n' > '$child/cgroup.kill'"
              sudo rmdir "$child"
            done
            remaining="$(sudo cat "$group/cgroup.procs")"
            if [[ -n "$remaining" ]]; then
              echo "::error::delegated cgroup still contains processes: $remaining"
              exit 1
            fi
            sudo sh -c "printf '%s\\n' '-cpu -memory -pids' > '$group/cgroup.subtree_control'"
            sudo rmdir "$group"
          fi
