name: Publish crates.io release

on:
  push:
    tags:
      # Cargo release tags are semver-shaped. The shorter v1 tag is reserved
      # for the GitHub Action major-version pointer.
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing semver release tag to publish or resume
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  publish:
    name: Publish crates.io packages
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    environment:
      # Configure this environment with required reviewers and the matching
      # crates.io Trusted Publisher configuration before creating a tag.
      name: crates-io
      url: https://crates.io/

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Prepare Ubuntu for Bubblewrap namespaces
        run: |
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            test "$(< /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 0
          fi

      - name: Install sandbox runtime
        run: bash .github/scripts/install-bubblewrap.sh

      - name: Install red-team tools
        run: sudo apt-get install --yes python3 util-linux

      - name: Prepare delegated cgroup v2 resources
        shell: bash
        run: |
          set -euo pipefail
          root=/sys/fs/cgroup
          group="$root/cargo-cage-release"
          leaf="$group/runner"
          if sudo test -e "$group"; then
            echo "::error::delegated cgroup path already exists: $group"
            exit 1
          fi
          for controller in cpu memory pids; do
            sudo grep -qw "$controller" "$root/cgroup.controllers" || {
              echo "::error::required cgroup controller is unavailable: $controller"
              exit 1
            }
          done
          sudo sh -c 'printf "+cpu +memory +pids\n" > /sys/fs/cgroup/cgroup.subtree_control'
          sudo mkdir "$group"
          sudo grep -qw cpu "$root/cgroup.subtree_control"
          sudo grep -qw memory "$root/cgroup.subtree_control"
          sudo grep -qw pids "$root/cgroup.subtree_control"
          sudo sh -c "printf '+cpu +memory +pids\\n' > '$group/cgroup.subtree_control'"
          sudo mkdir "$leaf"
          sudo chown "$USER":"$USER" "$group" "$group/cgroup.procs" "$leaf" "$leaf/cgroup.procs"
          sudo sh -c "printf '%s\\n' '$PPID' > '$leaf/cgroup.procs'"

      - name: Run full CI gate before publishing
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=15s 15m \
            cargo run --manifest-path tools/ci-check/Cargo.toml --locked -- \
            --require-linux

      - name: Verify release tag
        shell: bash
        run: |
          set -euo pipefail
          expected="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "cargo-cage") | .version')"
          actual="${RELEASE_TAG#v}"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Tag v$actual does not match workspace version $expected"
            exit 1
          fi

      - name: Inspect package contents
        shell: bash
        run: |
          set -euo pipefail
          for package in cargo-cage-core cargo-cage-cargo cargo-cage-linux cargo-cage; do
            echo "--- $package ---"
            cargo package --locked --package "$package" --list
          done

      - name: Check crates.io release state
        id: registry_state
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"

          registry_state() {
            local crate="$1"
            local status
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              "https://crates.io/api/v1/crates/$crate/$version")"
            case "$status" in
              200) printf 'published' ;;
              404) printf 'missing' ;;
              *)
                echo "::error::could not inspect crates.io state for $crate $version (HTTP $status)" >&2
                return 1
                ;;
            esac
          }

          echo "cargo_cage_core=$(registry_state cargo-cage-core)" >> "$GITHUB_OUTPUT"
          echo "cargo_cage_cargo=$(registry_state cargo-cage-cargo)" >> "$GITHUB_OUTPUT"
          echo "cargo_cage_linux=$(registry_state cargo-cage-linux)" >> "$GITHUB_OUTPUT"
          echo "cargo_cage=$(registry_state cargo-cage)" >> "$GITHUB_OUTPUT"

      - name: Dry-run packages without registry credentials
        if: steps.registry_state.outputs.cargo_cage_core == 'missing'
        shell: bash
        run: |
          set -euo pipefail
          # Dependent prerelease crates cannot be dry-run until their exact
          # dependency version exists in the crates.io index. The remaining
          # packages are dry-run immediately before their own upload below.
          for package in cargo-cage-core; do
            echo "--- dry-run: $package ---"
            cargo publish --locked --package "$package" --dry-run
          done

      - name: Authenticate with crates.io
        id: crates_io_auth
        if: >-
          steps.registry_state.outputs.cargo_cage_core == 'missing' ||
          steps.registry_state.outputs.cargo_cage_cargo == 'missing' ||
          steps.registry_state.outputs.cargo_cage_linux == 'missing' ||
          steps.registry_state.outputs.cargo_cage == 'missing'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish packages in dependency order (cargo-cage-core)
        if: steps.registry_state.outputs.cargo_cage_core == 'missing'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          # The upload skips verification so package build code never
          # receives the short-lived crates.io token from this step.
          cargo publish --locked --package cargo-cage-core --no-verify

      - name: Dry-run cargo-cage-cargo without registry credentials
        if: steps.registry_state.outputs.cargo_cage_cargo == 'missing'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if cargo publish --locked --package cargo-cage-cargo --dry-run; then
              exit 0
            fi
            if [[ "$attempt" -eq 12 ]]; then
              echo "::error::cargo-cage-core did not become available for the cargo-cage-cargo dry-run"
              exit 1
            fi
            echo "cargo-cage-core is not visible in the crates.io index yet; retrying in 5s (attempt $attempt/12)"
            sleep 5
          done

      - name: Publish cargo-cage-cargo
        if: steps.registry_state.outputs.cargo_cage_cargo == 'missing'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
        shell: bash
        run: cargo publish --locked --package cargo-cage-cargo --no-verify

      - name: Dry-run cargo-cage-linux without registry credentials
        if: steps.registry_state.outputs.cargo_cage_linux == 'missing'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if cargo publish --locked --package cargo-cage-linux --dry-run; then
              exit 0
            fi
            if [[ "$attempt" -eq 12 ]]; then
              echo "::error::cargo-cage-core did not become available for the cargo-cage-linux dry-run"
              exit 1
            fi
            echo "cargo-cage-core is not visible in the crates.io index yet; retrying in 5s (attempt $attempt/12)"
            sleep 5
          done

      - name: Publish cargo-cage-linux
        if: steps.registry_state.outputs.cargo_cage_linux == 'missing'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
        shell: bash
        run: cargo publish --locked --package cargo-cage-linux --no-verify

      - name: Dry-run cargo-cage without registry credentials
        if: steps.registry_state.outputs.cargo_cage == 'missing'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if cargo publish --locked --package cargo-cage --dry-run; then
              exit 0
            fi
            if [[ "$attempt" -eq 12 ]]; then
              echo "::error::cargo-cage dependencies did not become available for the cargo-cage dry-run"
              exit 1
            fi
            echo "cargo-cage dependencies are not visible in the crates.io index yet; retrying in 5s (attempt $attempt/12)"
            sleep 5
          done

      - name: Publish cargo-cage
        if: steps.registry_state.outputs.cargo_cage == 'missing'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
        shell: bash
        run: cargo publish --locked --package cargo-cage --no-verify

      - name: Clean up delegated cgroup v2 resources
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root=/sys/fs/cgroup
          group="$root/cargo-cage-release"
          if [[ -d "$group" ]]; then
            sudo sh -c "printf '%s\\n' '$BASHPID' > '$root/cgroup.procs'; printf '%s\\n' '$PPID' > '$root/cgroup.procs'"
            sudo sh -c "printf '1\\n' > '$group/cgroup.kill'"
            mapfile -t children < <(sudo find "$group" -mindepth 1 -type d -depth -print)
            for child in "${children[@]}"; do
              sudo sh -c "printf '1\\n' > '$child/cgroup.kill'"
              sudo rmdir "$child"
            done
            remaining="$(sudo cat "$group/cgroup.procs")"
            if [[ -n "$remaining" ]]; then
              echo "::error::delegated cgroup still contains processes: $remaining"
              exit 1
            fi
            sudo sh -c "printf '%s\\n' '-cpu -memory -pids' > '$group/cgroup.subtree_control'"
            sudo rmdir "$group"
          fi

  verify-install:
    name: Verify fresh Ubuntu installation
    needs: publish
    runs-on: ubuntu-24.04

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Prepare Ubuntu for Bubblewrap namespaces
        run: |
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            test "$(< /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 0
          fi

      - name: Install sandbox runtime
        run: bash .github/scripts/install-bubblewrap.sh

      - name: Prepare delegated cgroup v2 resources
        shell: bash
        run: |
          set -euo pipefail
          root=/sys/fs/cgroup
          group="$root/cargo-cage-install"
          leaf="$group/runner"
          if sudo test -e "$group"; then
            echo "::error::delegated cgroup path already exists: $group"
            exit 1
          fi
          for controller in cpu memory pids; do
            sudo grep -qw "$controller" "$root/cgroup.controllers" || {
              echo "::error::required cgroup controller is unavailable: $controller"
              exit 1
            }
          done
          sudo sh -c 'printf "+cpu +memory +pids\n" > /sys/fs/cgroup/cgroup.subtree_control'
          sudo mkdir "$group"
          sudo grep -qw cpu "$root/cgroup.subtree_control"
          sudo grep -qw memory "$root/cgroup.subtree_control"
          sudo grep -qw pids "$root/cgroup.subtree_control"
          sudo sh -c "printf '+cpu +memory +pids\\n' > '$group/cgroup.subtree_control'"
          sudo mkdir "$leaf"
          sudo chown "$USER":"$USER" "$group" "$group/cgroup.procs" "$leaf" "$leaf/cgroup.procs"
          sudo sh -c "printf '%s\\n' '$PPID' > '$leaf/cgroup.procs'"

      - name: Install cargo-cage from crates.io
        env:
          VERSION: ${{ env.RELEASE_TAG }}
        run: cargo install cargo-cage --locked --version "${VERSION#v}"

      - name: Run a clean Cargo smoke build
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir="$(mktemp -d)"
          cargo new --quiet --bin "$smoke_dir/smoke-project"
          cd "$smoke_dir/smoke-project"
          cargo-cage --help >/dev/null
          cargo-cage doctor
          cargo-cage build

      - name: Clean up delegated cgroup v2 resources
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root=/sys/fs/cgroup
          group="$root/cargo-cage-install"
          if [[ -d "$group" ]]; then
            sudo sh -c "printf '%s\\n' '$BASHPID' > '$root/cgroup.procs'; printf '%s\\n' '$PPID' > '$root/cgroup.procs'"
            sudo sh -c "printf '1\\n' > '$group/cgroup.kill'"
            mapfile -t children < <(sudo find "$group" -mindepth 1 -type d -depth -print)
            for child in "${children[@]}"; do
              sudo sh -c "printf '1\\n' > '$child/cgroup.kill'"
              sudo rmdir "$child"
            done
            remaining="$(sudo cat "$group/cgroup.procs")"
            if [[ -n "$remaining" ]]; then
              echo "::error::delegated cgroup still contains processes: $remaining"
              exit 1
            fi
            sudo sh -c "printf '%s\\n' '-cpu -memory -pids' > '$group/cgroup.subtree_control'"
            sudo rmdir "$group"
          fi

  github-draft:
    name: Create GitHub draft release
    needs: verify-install
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Create draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          title="cargo-cage $tag"
          if [[ "$tag" == *-* ]]; then
            prerelease_flag=(--prerelease)
          else
            prerelease_flag=(--prerelease=false)
          fi

          response_file="$(mktemp)"
          error_file="$(mktemp)"
          trap 'rm -f "$response_file" "$error_file"' EXIT
          set +e
          gh api --include \
            "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
            >"$response_file" 2>"$error_file"
          api_exit=$?
          set -e

          status="$(sed -n '1s/^HTTP[^ ]* \([0-9][0-9][0-9]\).*/\1/p' "$response_file")"
          if [[ "$api_exit" -eq 0 && "$status" == "200" ]]; then
            is_draft="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
            if [[ "$is_draft" != "true" ]]; then
              echo "::error::Release $tag already exists and is published; immutable releases must never be edited or moved"
              exit 1
            fi
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              "${prerelease_flag[@]}" \
              --title "$title"
          elif [[ "$status" == "404" ]]; then
            create_args=(
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --title "$title" \
              --generate-notes
              "${prerelease_flag[@]}"
            )
            gh release create "$tag" "${create_args[@]}"
          else
            echo "::error::Could not determine whether GitHub release $tag exists; refusing to create or edit a release"
            cat "$error_file" >&2
            sed -n '1,12p' "$response_file" >&2
            exit 1
          fi
